# Single source for every host plugin manifest, marketplace index and the
# Desktop Extension manifest. Edit this file, then regenerate:
#
#   uv run --no-project python scripts/sync_plugin_manifests.py
#
# The version comes from pyproject.toml. CI fails if a generated file drifts.

name = "nz-openbank-mcp"
display_name = "NZ Open Banking MCP (Akahu)"
description = "Unofficial MCP server for the Akahu open-finance API (NZ). 14 tools, read-only by default, runs locally over stdio."
short_description = "Akahu open finance (NZ): accounts, transactions, identity"
server_name = "akahu"
homepage = "https://github.com/thatskiff33/nz-openbank-mcp"
repository = "https://github.com/thatskiff33/nz-openbank-mcp"
license = "Apache-2.0"
keywords = ["mcp", "akahu", "open-finance", "new-zealand", "banking"]
long_description = "Ask your AI assistant about your New Zealand bank accounts through Akahu open finance, using a Personal App you control. Runs locally over stdio, starts read-only, and asks before every write. Unofficial; not affiliated with Akahu or any bank."
codex_short_description = "NZ bank accounts via Akahu"
documentation = "https://github.com/thatskiff33/nz-openbank-mcp#readme"
support = "https://github.com/thatskiff33/nz-openbank-mcp/issues"
privacy_policies = [
  "https://github.com/thatskiff33/nz-openbank-mcp/blob/main/PRIVACY.md",
  "https://www.akahu.nz/privacy-notice",
]
# Relative to plugin/; the Desktop Extension ships its own copy as mcpb/icon.png.
logo = "assets/logo.png"
category = "Finance"
grok_category = "productivity"

# MCP Registry entry (server.json). The name must stay under io.github.<owner>/
# and match the `mcp-name:` line in README.md, which PyPI publishes.
[registry]
name = "io.github.thatskiff33/nz-openbank-mcp"
title = "NZ Open Banking MCP (Akahu)"
description = "Ask about your NZ bank accounts via Akahu open finance. Read-only by default, consent per write."
icon = "https://raw.githubusercontent.com/thatskiff33/nz-openbank-mcp/main/docs/assets/icon.svg"

[author]
name = "thatskiff33"
email = "258212727+thatskiff33@users.noreply.github.com"
url = "https://github.com/thatskiff33"

[marketplace]
name = "nz-openbank"
display_name = "NZ Open Banking MCP (Akahu)"
description = "MCP server for New Zealand open banking via the Akahu API. Read-by-default, write-with-consent."

# One entry per environment variable the server reads. `key` is the
# Claude Code / Desktop Extension user-config key; it must equal the
# lowercased variable name. Optional settings need a default.
[[setting]]
var = "AKAHU_USER_TOKEN"
key = "akahu_user_token"
title = "Akahu User Token"
description = "User token from https://my.akahu.nz/developers."
sensitive = true

[[setting]]
var = "AKAHU_APP_TOKEN"
key = "akahu_app_token"
title = "Akahu App Token"
description = "App token from https://my.akahu.nz/developers."
sensitive = true

[[setting]]
var = "AKAHU_READ_ONLY"
key = "akahu_read_only"
title = "Read-only mode"
description = "Refuse all write tools when 'true'. Leave as 'true' unless you specifically need refresh/verify/report writes."
default = "true"

[[setting]]
var = "AKAHU_AUTOMATION_BYPASS"
key = "akahu_automation_bypass"
title = "Automation bypass"
description = "Skip per-call consent prompts for safe-to-automate writes (account refresh only). Requires read-only=false."
default = "false"

[[setting]]
var = "AKAHU_MASK_ACCOUNTS"
key = "akahu_mask_accounts"
title = "Mask account numbers"
description = "When 'true', account numbers show only the bank code, last four digits and suffix. Default 'false' shows them in full. Transaction descriptions are never masked."
default = "false"

# Tool list shown by hosts before install. tests/test_plugin_manifests.py checks it
# against the server's tools.

[[tool]]
name = "acct_list_accounts"
description = "Every connected account, with account numbers and balances"

[[tool]]
name = "acct_get_account"
description = "One account by id"

[[tool]]
name = "acct_get_account_balance"
description = "Just the balance of one account"

[[tool]]
name = "acct_get_pending_transactions"
description = "Unsettled transactions for one account"

[[tool]]
name = "acct_refresh_all_accounts"
description = "Ask Akahu to fetch fresh data for every account (write)"

[[tool]]
name = "acct_refresh_account"
description = "Ask Akahu to fetch fresh data for one account (write)"

[[tool]]
name = "txn_get_transactions"
description = "Settled transactions filtered by account, dates, category or amount"

[[tool]]
name = "txn_get_transaction"
description = "One transaction by id"

[[tool]]
name = "txn_get_transactions_by_ids"
description = "Several transactions in one request"

[[tool]]
name = "txn_get_pending_transactions"
description = "Unsettled transactions across all accounts"

[[tool]]
name = "txn_search_transactions"
description = "Text search over description and merchant"

[[tool]]
name = "txn_report_transaction_issue"
description = "Open a support ticket with Akahu about a transaction (write)"

[[tool]]
name = "id_get_me"
description = "The Akahu user's profile"

[[tool]]
name = "id_verify_name"
description = "Check a name against the account holder (write, extra scope)"
