# Build, gate, and publish when a GitHub Release is published.
#
# Trust model:
#   - Runs only on `release: published`. PR and main checks live in ci.yml.
#   - The tagged commit must already have a successful `ci-ok` check from ci.yml.
#   - PyPI authenticates via Trusted Publishing (OIDC); no API tokens are stored.
#     See PUBLISHING.md for the one-time PyPI side setup.
#   - The 'pypi' environment is the trust anchor on the PyPI side and the
#     place for required-reviewer rules in GitHub.

name: release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: ci passed on main for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # compare the tagged commit with main
      actions: read # read ci.yml workflow runs
    steps:
      - name: require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          echo "tagged commit $SHA relative to main: $status"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "Release blocked: the tagged commit is not on main."
            exit 1
          fi

      - name: require a successful full ci.yml run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A release published right after a merge may race main's CI run, so
          # wait for it rather than failing early.
          for attempt in $(seq 1 50); do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=100")
            success=$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")
            pending=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")
            echo "attempt $attempt: successful=$success in-progress=$pending"
            if [ "$success" -gt 0 ]; then exit 0; fi
            if [ "$pending" -eq 0 ]; then break; fi
            sleep 30
          done
          echo "Release blocked: no successful ci.yml push run on main for $SHA."
          exit 1

  build:
    name: build sdist + wheel
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false

      - name: assert pyproject version matches release tag
        run: |
          pyproject_version=$(uv run --no-project python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "Version mismatch: pyproject.toml=$pyproject_version but release tag=$tag_version"
            exit 1
          fi
          echo "Version $pyproject_version matches tag $GITHUB_REF_NAME"

      - name: build sdist + wheel
        run: uv build

      - name: upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  build-mcpb:
    name: build .mcpb desktop extension
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: assert mcpb manifest version matches release tag
        run: |
          manifest_version=$(jq -r .version mcpb/manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Version mismatch: mcpb/manifest.json=$manifest_version but release tag=$tag_version"
            exit 1
          fi
          echo "Version $manifest_version matches tag $GITHUB_REF_NAME"

      - name: pack .mcpb bundle
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "dist/nz-openbank-mcp-${version}.mcpb"

      - name: upload bundle artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  upload-mcpb:
    name: attach .mcpb to the GitHub Release
    needs: build-mcpb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release upload attaches the .mcpb to this Release
    steps:
      - name: download bundle artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: dist/

      - name: upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nz-openbank-mcp
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: download artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
