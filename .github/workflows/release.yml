# Build, gate, and publish a tagged release.
#
# Trust model:
#   - Run by `workflow_dispatch` from a v* tag. With `publish` unset it is the
#     TestPyPI dry run. With `publish` set it publishes to PyPI, then creates
#     the GitHub Release as a draft, attaches the wheel, sdist and .mcpb, and
#     publishes it. Releases are immutable once published, so assets must be
#     attached while the release is still a draft.
#   - The tagged commit must be on main with a successful ci.yml push run.
#   - PyPI and TestPyPI authenticate via Trusted Publishing (OIDC); no API
#     tokens are stored. See PUBLISHING.md for the one-time setup.
#   - The 'pypi' and 'testpypi' environments accept only v* tags; 'pypi' also
#     requires a reviewer.
#   - Release assets carry GitHub build provenance (`gh attestation verify`).
#   - After PyPI, server.json goes to the MCP Registry, authenticated by
#     GitHub OIDC for the io.github.thatskiff33/* namespace.

name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI and create the GitHub Release (unset is the TestPyPI dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.publish }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci-gate:
    name: ci passed on main for the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # compare the tagged commit with main
      actions: read # read ci.yml workflow runs
    steps:
      - name: require a v* tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ "$REF_NAME" != v* ]]; then
            echo "Release blocked: run from a v* tag, not $REF_TYPE $REF_NAME."
            exit 1
          fi

      - name: require the tagged commit to be on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)
          echo "tagged commit $SHA relative to main: $status"
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "Release blocked: the tagged commit is not on main."
            exit 1
          fi

      - name: require a successful full ci.yml run on main for the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # A release published right after a merge may race main's CI run, so
          # wait for it rather than failing early.
          for attempt in $(seq 1 50); do
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=100")
            success=$(jq '[.workflow_runs[] | select(.conclusion == "success")] | length' <<<"$runs")
            pending=$(jq '[.workflow_runs[] | select(.status != "completed")] | length' <<<"$runs")
            echo "attempt $attempt: successful=$success in-progress=$pending"
            total=$(jq '.workflow_runs | length' <<<"$runs")
            if [ "$success" -gt 0 ]; then exit 0; fi
            # The push run can take a short while to appear after a merge.
            if [ "$pending" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$attempt" -ge 6 ]; }; then
              break
            fi
            sleep 30
          done
          echo "Release blocked: no successful ci.yml push run on main for $SHA."
          exit 1

  build:
    name: build sdist + wheel
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false

      - name: assert pyproject version matches release tag
        run: |
          pyproject_version=$(uv run --no-project python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pyproject_version" != "$tag_version" ]; then
            echo "Version mismatch: pyproject.toml=$pyproject_version but release tag=$tag_version"
            exit 1
          fi
          echo "Version $pyproject_version matches tag $GITHUB_REF_NAME"

      - name: manifests, launch pins and version lockstep
        run: uv run --no-project python scripts/check_packaging.py

      # Checked here, before any publish job, so a missing section fails the
      # release while the version can still be used.
      - name: release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## ${version} " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no '## ${version} - <date>' section"
            exit 1
          fi

      # The build backend comes from a hash-pinned constraints file, so the
      # trusted build job only runs reviewed versions of hatchling and its deps.
      - name: build sdist + wheel
        run: uv build --build-constraints .github/build-constraints/requirements.txt --require-hashes

      - name: upload artefacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  build-mcpb:
    name: build .mcpb desktop extension
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: assert mcpb manifest version matches release tag
        run: |
          manifest_version=$(jq -r .version mcpb/manifest.json)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "Version mismatch: mcpb/manifest.json=$manifest_version but release tag=$tag_version"
            exit 1
          fi
          echo "Version $manifest_version matches tag $GITHUB_REF_NAME"

      - name: pack .mcpb bundle
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "dist/nz-openbank-mcp-${version}.mcpb"

      # The packer has unlocked npm dependencies, so check every file it wrote.
      - name: assert the packed bundle matches mcpb/ file for file
        run: python3 scripts/check_mcpb_bundle.py "dist/nz-openbank-mcp-${GITHUB_REF_NAME#v}.mcpb"

      - name: upload bundle artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: dist/*.mcpb
          if-no-files-found: error

  github-release:
    name: publish the GitHub Release with wheel, sdist and .mcpb
    needs: [build, build-mcpb, publish]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the Release and attach its assets
      id-token: write # Sigstore signing for build provenance
      attestations: write # store provenance for the wheel, sdist and .mcpb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: download package artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: download bundle artefact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: dist/

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: .

      - name: create draft, attach assets, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  publish-testpypi:
    name: publish to TestPyPI (dry run)
    needs: [build, build-mcpb]
    if: ${{ !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nz-openbank-mcp
    permissions:
      id-token: write # OIDC token for TestPyPI Trusted Publishing
    steps:
      - name: download artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: publish to PyPI
    needs: [build, build-mcpb]
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nz-openbank-mcp
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - name: download artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-registry:
    name: publish server.json to the MCP Registry
    needs: publish
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC login for the io.github.thatskiff33/* namespace
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: assert server.json version matches the tag
        run: |
          version="$(jq -r '.version' server.json)"
          package="$(jq -r '.packages[0].version' server.json)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ] || [ "$package" != "$tag" ]; then
            echo "server.json version $version / package $package != tag $tag"
            exit 1
          fi

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: publish
        # The registry checks the PyPI release, which can lag the upload by minutes.
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

  publish-image:
    name: publish container image to GHCR
    needs: publish
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push ghcr.io/thatskiff33/nz-openbank-mcp
      id-token: write # Sigstore signing for build provenance
      attestations: write # store provenance for the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Both helpers pull images; pin them by digest (tags as of 2026-11-06).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
