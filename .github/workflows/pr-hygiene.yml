# Keeps personal email addresses off main. On PRs (including title and body
# edits, which is why this is apart from ci.yml) it checks commit emails,
# commit messages, added lines, title and body. On pushes to main it checks the
# commits GitHub wrote at merge time, whose author email comes from the merging
# account's settings. Anything pushed to a public branch is already public;
# account email privacy settings are what prevent that.

name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emails:
    name: no personal email addresses
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: commit emails, messages, added lines, PR title and body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Run the base branch's checker, so a PR cannot weaken the check it is
          # judged by; fall back to the PR's copy only where the base has none.
          if ! git show "$BASE_SHA:scripts/check_commit_emails.py" > "$RUNNER_TEMP/check.py" 2>/dev/null; then
            cp scripts/check_commit_emails.py "$RUNNER_TEMP/check.py"
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | {sha, author: .commit.author.email, committer: .commit.committer.email, message: .commit.message} | @json' \
            > "$RUNNER_TEMP/commits.jsonl"
          git diff --no-color --unified=0 "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/added.diff"
          python3 "$RUNNER_TEMP/check.py" "$RUNNER_TEMP/commits.jsonl" "$RUNNER_TEMP/added.diff"

  main-emails:
    name: main commits use noreply emails
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: commits pushed to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          fields='{sha, author: .commit.author.email, committer: .commit.committer.email, message: .commit.message} | @json'
          if [ "${BEFORE//0/}" = "" ]; then
            gh api "repos/$REPO/commits/$AFTER" --jq "$fields" > "$RUNNER_TEMP/commits.jsonl"
          else
            gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq ".commits[] | $fields" > "$RUNNER_TEMP/commits.jsonl"
          fi
          python3 scripts/check_commit_emails.py "$RUNNER_TEMP/commits.jsonl"
