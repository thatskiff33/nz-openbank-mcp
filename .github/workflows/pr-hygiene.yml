# Pull request checks that must also re-run when the title or body is edited,
# kept apart from ci.yml so an edit does not re-run the whole suite.

name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  emails:
    name: no personal email addresses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: commit emails, trailers, PR title and body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/commits" \
            --jq '.[] | {sha, author: .commit.author.email, committer: .commit.committer.email, message: .commit.message} | @json' \
            > "$RUNNER_TEMP/commits.jsonl"
          python3 scripts/check_commit_emails.py "$RUNNER_TEMP/commits.jsonl"
