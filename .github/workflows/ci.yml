name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs: a new push cancels the stale run. main, schedule and manual runs
  # get a unique group and are never cancelled.
  group: >-
    ${{ github.event_name == 'pull_request'
      && format('ci-pr-{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && format('ci-main-{0}', github.sha)
      || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv caches are saved only by main, scheduled and manual runs; PRs restore them.
env:
  UV_VERSION: "0.13.5"
  # cursor/plugins commit whose schemas/ validate the Cursor manifests.
  CURSOR_PLUGINS_SHA: ae5650febf4320793844c12c4adaa937f417f8da

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      python: ${{ steps.out.outputs.python }}
      deps: ${{ steps.out.outputs.deps }}
      workflows: ${{ steps.out.outputs.workflows }}
      packaging: ${{ steps.out.outputs.packaging }}
      docs: ${{ steps.out.outputs.docs }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'ruff.toml'
              - 'scripts/**'
            deps:
              - 'pyproject.toml'
              - 'uv.lock'
            workflows:
              - '.github/**'
            packaging:
              - 'plugin/**'
              - 'mcpb/**'
              - '.claude-plugin/**'
              - '.agents/**'
              - '.cursor-plugin/**'
              - '.grok-plugin/**'
              - 'pyproject.toml'
              - 'src/nz_openbank_mcp/__init__.py'
              - 'scripts/check_packaging.py'
              - 'scripts/sync_plugin_manifests.py'
              - 'scripts/check_npm_tarball.py'
              - 'server.json'
              - 'npm/**'
              - 'examples/**'
              - 'Dockerfile'
              - '.dockerignore'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'deploy/**'
              - 'scripts/check_md_links.py'

      - name: resolve outputs (full run outside PRs or on workflow changes)
        id: out
        env:
          EVENT: ${{ github.event_name }}
          PYTHON: ${{ steps.filter.outputs.python }}
          DEPS: ${{ steps.filter.outputs.deps }}
          WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          PACKAGING: ${{ steps.filter.outputs.packaging }}
          DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          for name in python deps workflows packaging docs; do
            upper="${name^^}"
            value="${!upper}"
            if [ "$EVENT" = "pull_request" ] && [ -z "$value" ]; then
              echo "paths-filter produced no '$name' output"
              exit 1
            fi
            # A workflow change can break any job, so it runs them all.
            if [ "$EVENT" != "pull_request" ] || [ "$WORKFLOWS" = "true" ]; then
              value=true
            fi
            echo "$name=$value" >> "$GITHUB_OUTPUT"
            echo "$name=$value"
          done

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Runs on every Python change, not only dependency changes.
      - name: bandit
        run: uv run bandit -q -r src

  types:
    name: types
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: uv sync --locked --extra dev
      - run: uv run mypy src

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.14", "3.15"]
        exclude:
          - os: macos-latest
            python: "3.15"
          - os: windows-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: uv sync --locked --extra dev
      # POSIX-only branches (file mode checks) cannot be covered on Windows,
      # so the coverage gate runs on one Linux job.
      - name: pytest with 100% coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: uv run pytest
      - name: pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.14'
        run: uv run pytest --no-cov

  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
          cache-python: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.event_name != 'pull_request' }}
      - run: uv sync --locked --extra dev
      - name: pip-audit on the lock
        run: |
          uv export --frozen --no-emit-project --all-extras --format requirements-txt \
            | uv run pip-audit --strict --disable-pip --require-hashes -r /dev/stdin

  workflow-lint:
    name: workflow-lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: actionlint
        run: uvx --from actionlint-py==1.7.12.25 actionlint -color
      - name: zizmor
        run: uvx zizmor==1.31.1 --offline --format plain .github/

  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: generated manifests match plugin/plugin.base.toml
        run: uv run --no-project python scripts/sync_plugin_manifests.py --check
      - name: manifests and version lockstep
        run: uv run --no-project python scripts/check_packaging.py
      - name: Cursor manifests against Cursor's published schemas
        env:
          SCHEMAS: https://raw.githubusercontent.com/cursor/plugins/${{ env.CURSOR_PLUGINS_SHA }}/schemas
        run: |
          curl -fsSL -o "$RUNNER_TEMP/plugin.schema.json" "$SCHEMAS/plugin.schema.json"
          curl -fsSL -o "$RUNNER_TEMP/marketplace.schema.json" "$SCHEMAS/marketplace.schema.json"
          uvx check-jsonschema==0.33.0 --schemafile "$RUNNER_TEMP/plugin.schema.json" plugin/.cursor-plugin/plugin.json
          uvx check-jsonschema==0.33.0 --schemafile "$RUNNER_TEMP/marketplace.schema.json" .cursor-plugin/marketplace.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Claude Code plugin and marketplace validators
        run: |
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate ./plugin
          npx -y @anthropic-ai/claude-code@2.1.316 plugin validate .
      - name: Desktop Extension manifest validator
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
      - name: pack the Desktop Extension and check every file
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "$RUNNER_TEMP/ci.mcpb"
          python3 scripts/check_mcpb_bundle.py "$RUNNER_TEMP/ci.mcpb"
      - name: build sdist and wheel (hash-pinned build backend, as in release)
        run: uv build --build-constraints .github/build-constraints/requirements.txt --require-hashes
      - name: wheel smoke import
        run: |
          wheel=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$wheel" \
            python -c "from nz_openbank_mcp.server import build_server; build_server()"

  # The npm launcher (npm/) on each OS. Windows has no fake uvx script, so it
  # runs a renamed node.exe as uvx.exe to prove the lookup and exit status.
  npm-launcher:
    name: npm launcher (${{ matrix.os }}, node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "22" # the oldest version npm/package.json accepts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node --test npm/test/launch.test.js

  # Runs the release's npm publish command (release.yml, publish-npm) with
  # --dry-run, which needs no login and sends nothing. --provenance is left out
  # because it needs the release job's OIDC token. npm refuses even a dry run
  # of a version it already has, and between releases npm/package.json holds
  # the published version, so this job alone moves to the next patch first.
  npm-publish-dry-run:
    name: npm publish dry run
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release's Node (NPM_NODE_VERSION in release.yml), so the dry run
      # uses the same npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          package-manager-cache: false
      - name: move to the next patch version
        working-directory: npm
        run: npm version patch --no-git-tag-version --ignore-scripts
      - name: pack and check the tarball as the release does
        run: |
          version=$(jq -r .version npm/package.json)
          tarball="nz-openbank-mcp-${version}.tgz"
          mkdir -p npm-tarball
          npm pack ./npm --pack-destination npm-tarball --ignore-scripts
          python3 scripts/check_npm_tarball.py "npm-tarball/$tarball" "$version"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      # "./" matters: npm reads a bare "dir/file.tgz" as a GitHub user/repo.
      - run: npm publish "./npm-tarball/$TARBALL" --access public --ignore-scripts --dry-run

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: repo-relative Markdown links
        run: uv run --no-project python scripts/check_md_links.py

  image:
    name: container image builds and serves tools
    needs: changes
    if: needs.changes.outputs.packaging == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      # The image installs a prebuilt wheel. Build dist/ exactly as the release
      # does (sdist, then the wheel from it); .dockerignore drops the sdist.
      - name: build sdist and wheel (hash-pinned build backend)
        run: uv build --build-constraints .github/build-constraints/requirements.txt --require-hashes
      - name: build
        shell: bash # -o pipefail, so a failed build fails the step despite tee
        run: docker build --progress=plain -t nz-openbank-mcp:ci . 2>&1 | tee "$RUNNER_TEMP/image-build-amd64.log"
      # The release publishes amd64 and arm64; build arm64 here too (no push).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: build linux/arm64
        shell: bash # -o pipefail, as above
        run: docker buildx build --progress=plain --platform linux/arm64 . 2>&1 | tee "$RUNNER_TEMP/image-build-arm64.log"
      # Output lines of RUN steps look like "#12 0.53 text". uv, pip and
      # hatchling print one of these words when they build a package.
      - name: neither image build ran a build backend
        run: |
          for log in "$RUNNER_TEMP"/image-build-amd64.log "$RUNNER_TEMP"/image-build-arm64.log; do
            if grep -nE '^#[0-9]+ [0-9.]+ .*(hatchling|Building|Built |Preparing metadata)' "$log"; then
              echo "$log: the image build ran a build backend"
              exit 1
            fi
            grep -nE '^#[0-9]+ [0-9.]+ .*Installed 1 package' "$log"
          done
      - name: stdio smoke test lists 14 tools
        run: |
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 5
          } | timeout 60 docker run -i --rm -e AKAHU_USER_TOKEN=user_token_ci -e AKAHU_APP_TOKEN=app_token_ci nz-openbank-mcp:ci > out.jsonl
          count=$(jq -s '[.[] | select(.id == 2)][0].result.tools | length' out.jsonl)
          echo "tools: $count"
          test "$count" = 14

  # uvx (plugins, Desktop Extension) resolves fresh within the pyproject ranges
  # and ignores uv.lock. This runs the suite the same way, weekly and on demand.
  fresh-deps:
    name: tests on freshly resolved dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false
      - run: uv sync --upgrade --extra dev
      - name: resolved versions
        run: uv pip list | grep -iE '^(fastmcp|mcp|httpx|pydantic|pydantic-settings|starlette) '
      - run: uv run pytest --no-cov

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - lint
      - types
      - test
      - audit
      - workflow-lint
      - packaging
      - npm-launcher
      - npm-publish-dry-run
      - docs
      - image
      - fresh-deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every job succeeded or was skipped by path filtering
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended as: $result"; exit 1 ;;
            esac
          done
