[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "nz-openbank-mcp"
version = "0.1.3"
description = "Unofficial MCP server for the Akahu open-finance API (New Zealand). Personal Apps, read-by-default, write-with-consent."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
authors = [{ name = "nz-openbank-mcp contributors" }]
keywords = ["mcp", "akahu", "open-finance", "new-zealand", "banking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "fastmcp>=4.1.4,<5",
    "mcp>=2.3.0,<3",
    "mcp-types>=2.3.0,<3",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2,<2",
    # zoneinfo has no system time zone database on Windows. Calendar-versioned,
    # so uncapped: newer data is always wanted.
    "tzdata>=2026.6",
    # Transitive floors and exclusions. uvx ignores uv.lock and may reuse a
    # cached environment, so these keep known-vulnerable or known-broken
    # releases out of plugin and Desktop Extension launches.
    # sse-starlette 3.4.6 fails on import on Windows.
    "sse-starlette!=3.4.6",
    "anyio>=4.14.2",
    "authlib>=1.9.1",
    "certifi>=2026.10.18",
    "cryptography>=50.0.0",
    "dnspython>=2.9.0",
    "joserfc>=1.7.6",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=7.0,<8",
    "respx>=0.23,<1",
    "mypy>=2.0,<3",
    "ruff>=0.17,<0.18",
    "bandit>=1.9.4,<2",
    "pip-audit>=2.10.0,<3",
]

[project.scripts]
nz-openbank-mcp = "nz_openbank_mcp.server:main"
nz-openbank-mcp-http = "nz_openbank_mcp.server:http_main"

[project.urls]
Homepage = "https://github.com/thatskiff33/nz-openbank-mcp"
Repository = "https://github.com/thatskiff33/nz-openbank-mcp"
Issues = "https://github.com/thatskiff33/nz-openbank-mcp/issues"
Changelog = "https://github.com/thatskiff33/nz-openbank-mcp/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/nz_openbank_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/SECURITY.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:nz_openbank_mcp",
    "error::DeprecationWarning:tests",
]
testpaths = ["tests"]
addopts = "--cov=src/nz_openbank_mcp --cov-branch --cov-fail-under=100 --cov-report=term-missing -q"

[tool.coverage.run]
source = ["src/nz_openbank_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
