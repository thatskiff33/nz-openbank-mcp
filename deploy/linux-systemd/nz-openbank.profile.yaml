config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  listen_addr: "127.0.0.1:8080"
  url_file: "/run/nz-openbank-mcp/tunnel-health.url"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      command: "/opt/nz-openbank-mcp/.venv/bin/nz-openbank-mcp"
